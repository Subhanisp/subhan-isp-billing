<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subhan ISP - Billing</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{margin:0;background:#eef2f7;color:#1c2430;padding-bottom:64px}
.hdr{background:#0b4fa8;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 6px #0003}
.hdr h1{margin:0;font-size:19px}.hdr small{display:block;font-size:11px;opacity:.8}
.hdr button{background:#ffffff26;border:0;color:#fff;font-size:20px;border-radius:8px;padding:4px 12px}
#bar{display:none;text-align:center;font-size:12px;font-weight:700;padding:7px}
.box,.top,.dash{background:#fff;margin:10px;padding:12px;border-radius:10px}
.top{display:flex;flex-direction:column;gap:8px}
input,select{width:100%;padding:10px;border:1px solid #c9d1dc;border-radius:7px;font-size:15px;background:#fff}
label{font-size:12px;font-weight:700;color:#556}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tiles div{background:#eef2f7;border-radius:8px;padding:8px 2px}.tiles b{display:block;font-size:16px}.tiles span{font-size:11px;color:#556}
.prog{height:8px;background:#dde3ec;border-radius:5px;margin:10px 0 6px;overflow:hidden}.prog i{display:block;height:100%;background:#1f9d55}
.cnt{font-size:12px;color:#556;text-align:center}
.row{display:flex;gap:8px;margin:0 10px 10px}
.row button,.btn{flex:1;padding:10px;border:0;border-radius:7px;font-weight:700;font-size:14px;background:#3b4658;color:#fff}
.card{background:#fff;margin:0 10px 10px;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:5px solid #d93a3a}
.card.Paid{border-left-color:#1f9d55;background:#f5fff8}.card.Partial{border-left-color:#e8a317;background:#fffaf0}
.info{flex:1;min-width:0}.info h3{margin:0 0 3px;font-size:17px}.info p{margin:0;font-size:13px;color:#556}.info small{font-size:12px;font-weight:700;color:#8a5a00}
.acts{display:flex;flex-direction:column;gap:6px}
.bs{border:0;border-radius:7px;color:#fff;font-weight:700;padding:10px 12px;min-width:84px;font-size:14px}
.bs.Unpaid{background:#d93a3a}.bs.Partial{background:#e8a317}.bs.Paid{background:#1f9d55}
.wa{border:0;background:#25d366;border-radius:7px;padding:6px;font-size:16px}
#ov{display:none;position:fixed;inset:0;background:#0007;z-index:200;justify-content:center;align-items:center;padding:10px}
.m{display:none;background:#fff;border-radius:12px;padding:16px;width:100%;max-width:400px;max-height:90vh;overflow:auto;flex-direction:column;gap:9px}
.m h3{margin:0}.mb{display:flex;gap:8px;margin-top:4px}
.g{background:#1f9d55!important}.r{background:#d93a3a!important}.x{background:#6b7585!important}
.bs.Band{background:#6b7585}.card.Band{opacity:.75}.rec{white-space:pre-wrap;background:#f4f6f9;border-radius:8px;padding:10px;font-size:13px}
body.r-worker .no-w,body.r-sub .no-s,body:not(.r-owner) .ow{display:none!important}
.mini{padding:5px 9px;border:0;border-radius:6px;background:#3b4658;color:#fff;font-size:12px;margin-top:4px}.mini.r{background:#d93a3a}
.hist{font-size:13px;border-top:1px solid #e3e8ef;padding:6px 0}
#login{position:fixed;inset:0;background:#0b4fa8;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;padding:20px}
.lb{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}#login .lb .btn{max-width:none}#login .lb input{max-width:none;letter-spacing:normal;font-size:16px;text-align:left}#login h1{margin:0;font-size:30px}#login input{max-width:260px;text-align:center;font-size:22px;letter-spacing:6px}#login .btn{max-width:260px;flex:none;background:#1f9d55}
.ft{position:fixed;bottom:0;width:100%;background:#111;color:#fff;text-align:center;font-size:11px;padding:9px;z-index:40}.ft b{color:#4ade80}
</style>
</head>
<body>
<div id="login">
  <h1>Billing System</h1>
  <div id="pickBox" class="lb"></div>
  <div id="pwBox" class="lb" style="display:none"><div id="pwName" style="font-size:20px;font-weight:700;text-align:center"></div>
    <input id="un" placeholder="Username (malik ke liye: owner)" autocapitalize="off" autocomplete="username"><input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')unlock()">
    <button class="btn" onclick="unlock()">Open</button><button class="btn x" onclick="showPick()">Wapas</button></div>
  <div id="addBox" class="lb" style="display:none"><div style="font-weight:700;text-align:center">Nayi sheet jorein</div>
    <input id="aN" placeholder="Sheet ka naam"><input id="aU" placeholder="Google Web app URL (https://script.google.com/...)"><input id="aUn" placeholder="Username (nayi sheet par: apna naya malik username)" autocapitalize="off"><input type="password" id="aP" placeholder="Password">
    <button class="btn" onclick="addProf()">Jorein</button><button class="btn x" onclick="showPick()">Wapas</button></div>
  <div id="pwErr" style="color:#ffd0d0;font-weight:700;min-height:20px;text-align:center;max-width:300px"></div>
</div>

<div id="app" style="display:none">
  <div class="hdr"><div><h1 id="hName">Subhan ISP</h1><small id="hRole">Billing Collection</small></div><div><button onclick="loadSheet()">🔄</button> <button onclick="openM('menuM')">⋮</button></div></div>
  <div id="bar"></div>

  <div class="top">
    <label>Worker name</label><input id="worker" placeholder="Apna naam likhein" oninput="localStorage.setItem('si_w',this.value)">
    <label>Mahina</label><select id="month" onchange="render()"></select>
  </div>

  <div class="top ow" id="vsBox"><label>Kis ke customers dekhein</label><select id="vs" onchange="setVS(this.value)"></select><button class="btn" onclick="sumOpen()">📊 Sab ka summary (sub-dealers)</button></div>

  <div class="dash"><div class="tiles">
    <div><b id="dTot">0</b><span>Total bill</span></div><div><b id="dCol" style="color:#1f9d55">0</b><span>Wasool</span></div><div><b id="dRem" style="color:#d93a3a">0</b><span>Baqaya</span></div>
  </div><div class="prog"><i id="dPr" style="width:0"></i></div><div class="cnt" id="dCnt"></div></div>

  <div class="row no-w"><button onclick="custOpen()">➕ Naya customer</button><button onclick="openM('areaM')">🏢 Naya muhalla</button></div>

  <div class="top" style="margin-top:0">
    <input id="search" placeholder="🔍 Naam ya phone se dhoondein" oninput="render()">
    <select id="statF" onchange="render()"><option value="All">Sab (Paid, Partial, Unpaid)</option><option value="Unpaid">Sirf Unpaid</option><option value="Partial">Sirf Partial</option><option value="Paid">Sirf Paid</option><option value="Band">Sirf Band (disconnect)</option><option value="Expired">Sirf Expired (expire date guzar gayi)</option><option value="Due">Expired + Pending (wasooli wale)</option></select>
    <select id="areaF" onchange="render()"></select>
  </div>

  <div id="list"></div>
  <div class="ft">Created by <b>Muhammad Usman</b> | Mobile: 03009774171</div>

  <div id="ov">
    <div class="m" id="payM"><h3 id="pTitle"></h3><div id="pInfo" style="font-size:14px"></div>
      <div id="pAmtW"><label>Aaj kitni raqam mili (Rs.)</label><input type="number" id="pAmt"></div>
      <div class="mb"><button class="btn g" id="pSave" onclick="savePay()">Save payment</button><button class="btn" id="pRec" onclick="showRec(cur)">🧾</button><button class="btn r no-w" id="pReset" onclick="resetPay()">Reset</button><button class="btn x" onclick="closeM()">Band</button></div></div>

    <div class="m" id="custM"><h3 id="cTitle"></h3>
      <input id="cName" placeholder="Customer ka naam"><input id="cPhone" type="tel" placeholder="Phone (03xx...)"><select id="cArea"></select>
      <input id="cPkg" placeholder="Package (e.g. 10 Mbps)"><input id="cBill" type="number" placeholder="Monthly bill (Rs.)"><label>Pichhla baqaya (Rs.) - agar koi ho</label><input id="cPrev" type="number"><label>Connection ki tareekh (mahina)</label><input id="cSince" type="month"><label>Status</label><select id="cStat"><option value="Active">Active (chal raha hai)</option><option value="Band">Band (disconnect)</option></select><label>Expire date</label><input id="cExp" type="date">
      <div class="mb"><button class="btn g" onclick="saveCust()">Save</button><button class="btn x" onclick="closeM()">Cancel</button></div></div>

    <div class="m" id="areaM"><h3>Naya muhalla</h3><input id="aName" placeholder="Muhalla ka naam">
      <div class="mb"><button class="btn g" onclick="addArea()">Save</button><button class="btn x" onclick="closeM()">Cancel</button></div></div>

    <div class="m" id="detM"><h3 id="dName"></h3><div id="dBody" style="font-size:14px"></div>
      <div class="mb no-w"><button class="btn" onclick="custOpen(cur)">Edit</button><button class="btn r" onclick="delCust()">Delete</button></div>
      <div class="mb"><button class="btn g" onclick="wa(cur)">📲 WhatsApp</button><button class="btn x" onclick="closeM()">Band</button></div></div>

    <div class="m" id="recM"><h3>Raseed</h3><div class="rec" id="recT"></div><div class="mb"><button class="btn g" id="recWa" onclick="recWa()">📲 WhatsApp</button><button class="btn x" onclick="closeM()">Band</button></div></div>
    <div class="m" id="usrM"><h3>Sub-dealers / Workers</h3><div id="usrList" style="max-height:200px;overflow:auto"></div>
      <b style="font-size:14px">Naya banayein</b><select id="nuRole" onchange="nuCh()"></select><div id="nuParW"><select id="nuPar"></select></div>
      <input id="nuNm" placeholder="Naam"><input id="nuUn" placeholder="Username (chhote harf/number, 3+)" autocapitalize="off"><input id="nuPw" type="password" placeholder="Password (4+)">
      <div class="mb"><button class="btn g" onclick="addUser()">Banayein</button><button class="btn x" onclick="closeM()">Band</button></div></div>
    <div class="m" id="sumM"><h3>Sab ka summary</h3><div id="sumB" style="max-height:55vh;overflow:auto"></div><button class="btn x" onclick="closeM()">Band</button></div>
    <div class="m" id="menuM"><h3>Menu</h3>
      <button class="btn no-w" onclick="openM('areaM')">🏢 Naya muhalla</button>
      <button class="btn no-w" onclick="backup()">💾 Backup download karein</button>
      <button class="btn no-w" onclick="$('rf').click()">📂 Backup restore karein</button>
      <input type="file" id="rf" accept=".json" style="display:none" onchange="restore(this)">
      <button class="btn ow" onclick="setUrl()">🔗 Google Sheet URL set karein</button>
      <button class="btn" onclick="chPw()">🔑 Password badlein</button>
      <button class="btn ow" onclick="chName()">✏️ Sheet ka naam badlein</button>
      <button class="btn ow" onclick="shareLink()">📲 Is sheet ka link workers ko bhejein</button>
      <button class="btn" onclick="location.reload()">🔀 Doosri sheet kholein</button>
      <button class="btn r" onclick="delProf()">🗑️ Is sheet ko is phone se hatayein</button>
      <button class="btn" onclick="loadSheet()">⬇️ Sheet se data load karein</button>
      <button class="btn no-w" onclick="syncAll()">☁️ Sab data Sheet mein bhejein</button>
      <button class="btn no-w" onclick="usrOpen()">👥 Sub-dealers / Workers banayein</button>
      <button class="btn no-w" onclick="exportXl()">📤 Excel download (customers)</button>
      <button class="btn no-w" onclick="$('xf').click()">📥 Excel upload (customers)</button>
      <input type="file" id="xf" accept=".xlsx,.csv" style="display:none" onchange="importXl(this)">
      <button class="btn x" onclick="closeM()">Band</button></div>
  </div>
</div>

<script>
let CUR=null,PFX='',SK='',ME=null,VS='',USERS=[];
const PWH=5596543922622224;
const DEFAULT_URL="https://script.google.com/macros/s/AKfycbwWpFrp0y_VNkbrQ7g3g3KWtC8EzsMR7J0QIvATYdg0b7KI0181ZiPYFZALeB4FIyRC/exec";
const U=()=>CUR?CUR.url:'';
const $=id=>document.getElementById(id);
const H=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(PFX+k))||d}catch(e){return d}};
const S=(k,v)=>localStorage.setItem(PFX+k,JSON.stringify(v));
const GS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const p2=n=>String(n).padStart(2,'0');
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const mlabel=v=>MN[+v.slice(5)-1]+' '+v.slice(0,4);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const fd=s=>String(s).split('-').reverse().join('-');
const now=()=>{const d=new Date();return p2(d.getDate())+'-'+p2(d.getMonth()+1)+'-'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())};

let areas=[],custs=[],pays={},q=[],cur=null,editId=null,syncing=false;
let profiles=[];
try{profiles=JSON.parse(localStorage.getItem('si_profiles'))||[]}catch(e){profiles=[]}
if(!profiles.length||!Array.isArray(profiles)){profiles=[{id:'p1',name:'Subhan ISP',url:DEFAULT_URL,pwh:String(PWH),accts:{owner:{pwh:String(PWH),role:'owner',scope:'owner',name:'Malik'}}}];GS('si_profiles',profiles)}

profiles.forEach(p=>{if(!p.accts)p.accts=p.pwh?{owner:{pwh:p.pwh,role:'owner',scope:'owner',name:'Malik'}}:{}});
const hh=pw=>String(H('sisp|'+pw));
const srv=async(u,un,k)=>(await fetch(u+(u.includes('?')?'&':'?')+'action=auth&u='+encodeURIComponent(un)+'&k='+encodeURIComponent(k))).json();
const post=async(u,o)=>(await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)})).json();
let pi=0;
function showPick(){
  ['pwBox','addBox'].forEach(i=>$(i).style.display='none');$('pickBox').style.display='flex';$('pwErr').textContent='';
  $('pickBox').innerHTML=profiles.map((p,i)=>`<button class="btn" onclick="pickP(${i})">${esc(p.name)}</button>`).join('')+'<button class="btn x" onclick="showAdd()">➕ Nayi sheet jorein</button>';
}
function pickP(i){pi=i;$('pickBox').style.display='none';$('pwBox').style.display='flex';$('pwName').textContent=profiles[i].name;$('un').value=profiles[i].uname||'';$('pw').value='';$('pwErr').textContent='';$('pw').focus()}
function showAdd(n,u){$('pickBox').style.display='none';$('addBox').style.display='flex';$('aN').value=n||'';$('aU').value=u||'';$('aP').value='';$('pwErr').textContent=''}
async function unlock(){
  const p=profiles[pi],un=($('un').value.trim()||'owner').toLowerCase(),h=hh($('pw').value),e=m=>{$('pwErr').textContent=m;$('pw').value=''};$('pwErr').textContent='';
  let a=null;const o=p.accts[un],cached=o&&o.pwh===h?o:null;
  if(p.url&&navigator.onLine){
    try{const j=await srv(p.url,un,h);
      if(j.ok&&j.open){if(cached){await post(p.url,{u:un,k:h,act:'setup',hash:h});const j2=await srv(p.url,un,h);if(j2.ok&&!j2.open)a=j2}}
      else if(j.ok)a=j}
    catch(x){a=cached}
  }else a=cached;
  if(!a)return e('Username ya password galat hai');
  p.accts[un]={pwh:h,role:a.role,scope:a.scope,name:a.name||un};p.uname=un;GS('si_profiles',profiles);
  start(p,h,un,p.accts[un]);
}
function start(p,h,un,a){
  CUR=p;SK=h;ME={u:un,role:a.role,scope:a.scope,name:a.name};VS=a.scope;
  PFX=(p.id==='p1'&&un==='owner')?'':p.id+'_'+un+'_';
  areas=L('si_areas',["Area 1","Area 2"]);custs=L('si_custs',[]).map(c=>({...c,own:c.own||a.scope}));pays=L('si_pays',{});q=L('si_q',[]);
  document.body.className='r-'+a.role;
  $('login').style.display='none';$('app').style.display='block';$('hName').textContent=p.name;
  $('hRole').textContent=a.name+' ('+({owner:'Malik',sub:'Sub-dealer',worker:'Worker'}[a.role])+')';document.title=p.name+' - Billing';init();
}
async function addProf(){
  const n=$('aN').value.trim(),u=$('aU').value.trim(),un=($('aUn').value.trim()||'owner').toLowerCase(),pw=$('aP').value,e=m=>$('pwErr').textContent=m;
  if(!n||!/^https:\/\/script\.google\.com\//.test(u)||pw.length<4)return e('Naam, sahi URL aur kam az kam 4 harf ka password likhein');
  if(profiles.some(p=>p.url===u))return e('Ye sheet pehle se list mein hai');
  const h=hh(pw);let a;
  try{
    let j=await srv(u,un,h);
    if(j.ok&&j.open){if(prompt('Naya password dobara likhein (confirm):')!==pw)return e('Password match nahi hua');if(!(await post(u,{u:un,k:h,act:'setup',hash:h})).ok)throw 0;j=await srv(u,un,h)}
    if(!j.ok||j.open)return e('Username ya password galat hai');a=j;
  }catch(x){return e('Sheet se rabta nahi hua. URL aur internet check karein')}
  profiles.push({id:'p'+Date.now(),name:n,url:u,uname:un,accts:{[un]:{pwh:h,role:a.role,scope:a.scope,name:a.name||un}}});GS('si_profiles',profiles);showPick();
}
function lockOut(){alert('Password badal gaya hai ya galat hai. Dobara login karein.');if(CUR&&ME&&CUR.accts[ME.u])CUR.accts[ME.u].pwh='';GS('si_profiles',profiles);location.reload()}
async function chPw(){
  if(hh(prompt('Purana password:')||'')!==SK)return alert('Purana password galat hai');
  const n=prompt('Naya password (kam az kam 4 harf):');if(n===null)return;if(n.length<4)return alert('Password chhota hai');
  if(prompt('Naya password dobara likhein:')!==n)return alert('Dono password mel nahi khate');
  if(!navigator.onLine||!CUR.url)return alert('Password badalne ke liye internet aur Sheet URL zaroori hai');
  const nh=hh(n);
  try{if(!(await post(CUR.url,{u:ME.u,k:SK,act:'setpw',hash:nh})).ok)throw 0;CUR.accts[ME.u].pwh=nh;SK=nh;GS('si_profiles',profiles);closeM();alert('Password badal gaya. Doosre phoneon par ab naya password chalega.')}
  catch(e){alert('Password nahi badla. Internet ya URL check karein.')}
}
function chName(){const n=prompt('Sheet ka naam:',CUR.name);if(n&&n.trim()){CUR.name=n.trim();GS('si_profiles',profiles);$('hName').textContent=CUR.name;document.title=CUR.name+' - Billing';closeM()}}
function shareLink(){
  const u=location.href.split('#')[0]+'#add='+btoa(unescape(encodeURIComponent(JSON.stringify({n:CUR.name,u:CUR.url}))));
  try{navigator.clipboard.writeText(u)}catch(e){}
  window.open('https://wa.me/?text='+encodeURIComponent(CUR.name+' billing link (password alag se batayein): '+u),'_blank');
}
function delProf(){
  if(!confirm('Is sheet ko is phone se hatana hai? Google Sheet ka data nahi mitega, lekin is phone ka data hat jayega.'))return;
  ['si_areas','si_custs','si_pays','si_q'].forEach(k=>localStorage.removeItem(PFX+k));
  profiles=profiles.filter(p=>p!==CUR);GS('si_profiles',profiles);location.reload();
}
function init(){
  $('worker').value=localStorage.getItem('si_w')||'';
  const n=new Date(),cm=n.getFullYear()+'-'+p2(n.getMonth()+1);let y=2026,m=1;
  for(let i=0;i<60;i++){$('month').add(new Option(MN[m-1]+' '+y,y+'-'+p2(m)));if(++m>12){m=1;y++}}
  $('month').value=cm;render();loadSheet();
}
function openM(id){$('ov').style.display='flex';document.querySelectorAll('.m').forEach(e=>e.style.display='none');$(id).style.display='flex'}
function closeM(){$('ov').style.display='none'}
function bar(t,bg,fg,ms){const b=$('bar');b.style.display='block';b.style.background=bg;b.style.color=fg;b.textContent=t;if(ms)setTimeout(()=>b.style.display='none',ms)}

function fillAreas(){
  const old=$('areaF').value||'All';
  $('areaF').innerHTML='<option value="All">Sab muhallay</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');
  $('areaF').value=areas.includes(old)?old:'All';
}
const nm=m=>{let y=+m.slice(0,4),n=+m.slice(5)+1;if(n>12){n=1;y++}return y+'-'+p2(n)};
function carry(c,m){const s=c.pm||(c.since&&c.since>'2026-10'?c.since:'2026-10');if(m<s)return 0;let b=c.pm?(c.prev||0):0,k=s;for(let i=0;i<60&&k<m;i++){const p=pays[k+'_'+c.id];b+=(c.status==='Band'?0:c.bill)-(p?p.paid:0);k=nm(k)}return b}
function st(c,m){const p=pays[m+'_'+c.id],paid=p?p.paid:0,cr=carry(c,m),total=c.bill+cr;return{p,paid,carry:cr,total,rem:Math.max(total-paid,0),s:paid>=total?'Paid':paid>0?'Partial':'Unpaid'}}

function render(){
  fillAreas();
  const m=$('month').value,t=$('search').value.toLowerCase(),a=$('areaF').value,f=$('statF').value;
  let h='',n=0,tot=0,col=0,exN=0,cnt={Paid:0,Partial:0,Unpaid:0};
  custs.filter(c=>c.own===VS).forEach(c=>{
    const exp=c.status!=='Band'&&!!c.exp&&c.exp<today();if(exp)exN++;
